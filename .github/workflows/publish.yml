# Build the package and publish it to PyPI when a GitHub release is published.
#
# Uses PyPI "trusted publishing" (OIDC) - no API token secret needed.
# One-time setup on https://pypi.org/manage/project/sonnenbatterie/settings/publishing/:
#   owner: weltmeyer, repository: python_sonnenbatterie,
#   workflow: publish.yml, environment: pypi
#
# The release tag must match the version in setup.cfg (e.g. tag v0.7.2 <-> version = 0.7.2).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # manual run: builds + checks only, does not publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches setup.cfg
        if: github.event_name == 'release'
        run: |
          cfg_version=$(sed -n 's/^version *= *//p' setup.cfg)
          tag_version=${GITHUB_REF_NAME#v}
          echo "setup.cfg: $cfg_version  tag: $tag_version"
          test "$cfg_version" = "$tag_version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest requests aiohttp

      - name: Test with pytest
        run: pytest test/test_login_errors.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sonnenbatterie
    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
